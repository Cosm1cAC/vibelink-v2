mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://1.1.1.1/dns-query

proxies:
  - name: pchub
    type: http
    server: <PC_LAN_IP>
    port: 18996
    headers:
      X-Mesh-Token: <MESH_TOKEN>
  - name: pcexit
    type: http
    server: <PC_LAN_IP>
    port: 18997
    headers:
      X-Mesh-Token: <MESH_TOKEN>

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - pcexit
      - DIRECT

rules:
  - IP-CIDR,100.64.0.0/10,pchub,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - MATCH,PROXY
