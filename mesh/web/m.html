<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>mesh · 手机接管</title>
<link rel="stylesheet" href="/m.css">
</head>
<body>

<header class="bar">
  <button id="back" class="icon hidden" aria-label="返回">←</button>
  <div class="titles">
    <div class="title" id="title">mesh</div>
    <div class="sub" id="subtitle">正在连接…</div>
  </div>
  <button id="path" class="chip unknown" title="当前链路">…</button>
</header>

<main id="view"></main>

<div class="composer hidden" id="composer">
  <div class="mode" id="mode">排队</div>
  <button class="stop danger" id="stop" title="中断当前回合">停止</button>
  <textarea id="input" rows="1" placeholder="给 agent 发消息…" enterkeyhint="send"></textarea>
  <button class="send primary" id="send" aria-label="发送">↑</button>
</div>

<div class="gate" id="gate">
  <div class="box">
    <h1>mesh · 手机接管</h1>
    <p>输入 hub token。它只保存在本机浏览器。</p>
    <input id="token" type="password" placeholder="hub token" autocomplete="off">
    <button class="primary" id="gate-save">连接</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/m.js"></script>
</body>
</html>
